version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: learning-assistant-api
    restart: unless-stopped
    ports:
      - "${HOST:-0.0.0.0}:${PORT:-8000}:8000"
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.openai.com/v1}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.7}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-4096}
      - LOCAL_LLM_ENABLED=${LOCAL_LLM_ENABLED:-false}
      - LOCAL_LLM_MODEL=${LOCAL_LLM_MODEL:-Qwen/Qwen2.5-7B-Instruct}
      - LOCAL_LLM_BASE_URL=${LOCAL_LLM_BASE_URL:-http://localhost:1234/v1}
      - LOCAL_LLM_PATH=${LOCAL_LLM_PATH:-./models/llm}
      - LOCAL_LLM_DEVICE=${LOCAL_LLM_DEVICE:-cpu}
      - LOCAL_LLM_QUANTIZATION=${LOCAL_LLM_QUANTIZATION:-int8}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-bailian}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-v3}
      - EMBEDDING_DIMENSION=${EMBEDDING_DIMENSION:-1024}
      - LOCAL_EMBEDDING_ENABLED=${LOCAL_EMBEDDING_ENABLED:-false}
      - LOCAL_EMBEDDING_MODEL=${LOCAL_EMBEDDING_MODEL:-BAAI/bge-small-zh-v1.5}
      - LOCAL_EMBEDDING_PATH=${LOCAL_EMBEDDING_PATH:-./models/embedding}
      - LOCAL_EMBEDDING_DEVICE=${LOCAL_EMBEDDING_DEVICE:-cpu}
      - VECTOR_DB_TYPE=${VECTOR_DB_TYPE:-qdrant}
      - QDRANT_URL=${QDRANT_URL:-http://qdrant}
      - QDRANT_PORT=${QDRANT_PORT:-6333}
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - QDRANT_USE_LOCAL=${QDRANT_USE_LOCAL:-false}
      - QDRANT_LOCAL_PATH=${QDRANT_LOCAL_PATH:-./data/qdrant_store}
      - QDRANT_COLLECTION_NAME=${QDRANT_COLLECTION_NAME:-learning_assistant}
      - VECTOR_DIMENSION=${VECTOR_DIMENSION:-1024}
      - NEO4J_URI=${NEO4J_URI:-bolt://neo4j:7687}
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - NEO4J_DATABASE=${NEO4J_DATABASE:-neo4j}
      - SEARCH_ENGINE=${SEARCH_ENGINE:-serpapi}
      - SERPAPI_API_KEY=${SERPAPI_API_KEY}
      - SEARCH_MAX_RESULTS=${SEARCH_MAX_RESULTS:-5}
      - SEARCH_ENGINE_ID=${SEARCH_ENGINE_ID}
      - SEARCH_TIMEOUT=${SEARCH_TIMEOUT:-10}
      - MEMORY_MAX_MESSAGES=${MEMORY_MAX_MESSAGES:-50}
      - MEMORY_SUMMARY_ENABLED=${MEMORY_SUMMARY_ENABLED:-true}
      - CHECKPOINT_STORE_PATH=${CHECKPOINT_STORE_PATH:-./data/checkpoints}
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=${DEBUG:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - API_AUTH_ENABLED=${API_AUTH_ENABLED:-false}
      - API_KEY=${API_KEY}
    volumes:
      - api_data:/app/data
      - api_models:/app/models
    networks:
      - learning-network
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  qdrant:
    image: qdrant/qdrant:v1.16.0
    container_name: learning-assistant-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "6334:6334"
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - learning-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  neo4j:
    image: neo4j:5.26.0
    container_name: learning-assistant-neo4j
    restart: unless-stopped
    profiles:
      - full
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-password}
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=1g
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - learning-network
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "${NEO4J_USER:-neo4j}", "-p", "${NEO4J_PASSWORD:-password}", "RETURN 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  api_data:
    driver: local
  api_models:
    driver: local
  qdrant_data:
    driver: local
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local

networks:
  learning-network:
    driver: bridge
    name: learning-network