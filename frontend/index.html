<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AI 驱动的学习辅助系统，支持文件上传、智能问答、文档导出">
  <meta name="theme-color" content="#4f46e5">
  <title>学习辅助系统</title>

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/chat.css">
  <link rel="stylesheet" href="css/sidebar.css">
  <link rel="stylesheet" href="css/responsive.css">

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
</head>
<body>

  <!-- 登录页面 -->
  <div id="login-page" class="login-page active" role="main">
    <div class="auth-card" role="region" aria-label="登录区域">
      <h2>学习辅助</h2>

      <div class="auth-tabs" role="tablist">
        <button class="auth-tab active" data-tab="login" role="tab" aria-selected="true">登录</button>
        <button class="auth-tab" data-tab="register" role="tab" aria-selected="false">注册</button>
      </div>

      <form class="auth-form active" data-form="login" onsubmit="return false">
        <div class="form-group">
          <label for="login-username">用户名</label>
          <input type="text" id="login-username" placeholder="请输入用户名" autocomplete="username">
        </div>
        <div class="form-group">
          <label for="login-password">密码</label>
          <input type="password" id="login-password" placeholder="请输入密码" autocomplete="current-password">
        </div>
        <button type="button" id="btn-login" class="btn btn-primary btn-block">登录</button>
      </form>

      <form class="auth-form" data-form="register" onsubmit="return false">
        <div class="form-group">
          <label for="reg-username">用户名 <span class="form-hint">（必填，至少3个字符）</span></label>
          <input type="text" id="reg-username" placeholder="请输入用户名" autocomplete="username">
        </div>
        <div class="form-group">
          <label for="reg-display-name">昵称 <span class="form-hint">（可选）</span></label>
          <input type="text" id="reg-display-name" placeholder="请输入昵称">
        </div>
        <div class="form-group">
          <label for="reg-email">邮箱 <span class="form-hint">（可选）</span></label>
          <input type="email" id="reg-email" placeholder="请输入邮箱" autocomplete="email">
        </div>
        <div class="form-group">
          <label for="reg-password">密码 <span class="form-hint">（必填，至少6个字符）</span></label>
          <input type="password" id="reg-password" placeholder="请输入密码" autocomplete="new-password">
        </div>
        <div class="form-group">
          <label for="reg-password-confirm">确认密码</label>
          <input type="password" id="reg-password-confirm" placeholder="请再次输入密码" autocomplete="new-password">
        </div>
        <button type="button" id="btn-register" class="btn btn-primary btn-block">注册</button>
      </form>
    </div>
  </div>

  <!-- 主界面 -->
  <div id="main-page" class="page-container">
    <a href="#main-content" class="skip-link">跳至主内容</a>

    <div class="app-layout">
      <!-- 侧边栏遮罩 -->
      <div id="sidebar-overlay" class="sidebar-overlay"></div>

      <!-- 侧边栏 -->
      <aside id="sidebar" class="sidebar" role="navigation" aria-label="侧边导航">
        <div class="sidebar-header sidebar-user-info">
          <div class="sidebar-user-text">
            <h3 id="sidebar-display-name">用户</h3>
            <div class="username" id="sidebar-username">@username</div>
          </div>
          <button id="sidebar-close" class="sidebar-close" aria-label="关闭侧边栏">&#x2715;</button>
        </div>

        <div class="sidebar-body">
          <!-- 主题切换 -->
          <div class="sidebar-section">
            <div class="theme-toggle-row">
              <span class="theme-toggle-label">主题</span>
              <button id="btn-theme-toggle" class="theme-toggle-btn" aria-label="切换明暗主题">
                <svg class="theme-icon theme-icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                </svg>
                <svg class="theme-icon theme-icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                </svg>
              </button>
            </div>
          </div>

          <!-- Agent 选择器 -->
          <div class="sidebar-section">
            <details class="panel" id="panel-agent" open>
              <summary>Agent 选择</summary>
              <div class="panel-body">
                <div class="agent-selector" role="radiogroup" aria-label="选择 Agent">
                  <label class="radio-item checked">
                    <input type="radio" name="agent" value="auto" checked>
                    <span>自动识别 (推荐)</span>
                  </label>
                  <label class="radio-item">
                    <input type="radio" name="agent" value="planner">
                    <span>学习规划师</span>
                  </label>
                  <label class="radio-item">
                    <input type="radio" name="agent" value="expert">
                    <span>学习专家</span>
                  </label>
                  <label class="radio-item">
                    <input type="radio" name="agent" value="partner">
                    <span>学习伙伴</span>
                  </label>
                  <label class="radio-item">
                    <input type="radio" name="agent" value="quizzer">
                    <span>出题官</span>
                  </label>
                  <label class="radio-item">
                    <input type="radio" name="agent" value="reviewer">
                    <span>复习助理</span>
                  </label>
                  <label class="radio-item">
                    <input type="radio" name="agent" value="examiner">
                    <span>考试指导</span>
                  </label>
                </div>
              </div>
            </details>
          </div>

          <!-- 历史对话 -->
          <div class="sidebar-section">
            <div class="conv-header">
              <span class="conv-header-title">历史对话</span>
              <button id="btn-new-conv" class="btn-new-conv" aria-label="新建对话" title="新建对话">+</button>
            </div>
            <div id="conv-list" class="conv-list"></div>
          </div>

          <!-- 快捷操作 -->
          <div class="sidebar-section">
            <div class="quick-actions">
              <button type="button" id="btn-quick-plan" class="btn btn-secondary btn-sm">计划</button>
              <button type="button" id="btn-logout" class="btn btn-danger btn-sm">退出</button>
            </div>
          </div>
        </div>
      </aside>

      <!-- 汉堡菜单按钮 -->
      <button id="sidebar-toggle" class="sidebar-toggle" aria-label="展开侧边栏" aria-expanded="false">
        <span class="sidebar-toggle-icon">&rarr;</span>
      </button>

      <!-- 主内容区 -->
      <main class="main-content" id="main-content">
        <div class="chat-container">
          <!-- 消息区域 -->
          <div id="chat-messages" class="chat-messages" role="log" aria-live="polite" aria-label="聊天消息">
            <!-- 动态渲染 -->
          </div>

          <!-- 输入区域 -->
          <div class="chat-input-area">
            <!-- 已上传文件标签 -->
            <div class="attached-files" id="attached-files"></div>

            <!-- 上传进度 -->
            <div class="upload-progress" id="upload-progress">
              <div class="progress-bar"><div class="progress-fill"></div></div>
              <span class="progress-text"></span>
            </div>

            <!-- 输入行 -->
            <div class="chat-input-row">
              <button class="btn-attach" id="btn-attach" title="上传文件" aria-label="上传文件">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
                </svg>
              </button>
              <input type="file" class="upload-input" id="file-upload-input" accept=".pdf,.docx,.doc,.txt,.md,.py,.java,.cpp,.c,.h,.js,.ts,.html,.css,.json,.xml,.yaml,.yml,.csv">
              <textarea
                id="chat-input"
                rows="1"
                placeholder="输入你的问题，或上传文件后提问... (Enter 发送，Shift+Enter 换行)"
                aria-label="输入消息"
              ></textarea>
              <button id="btn-send" class="btn btn-send" aria-label="发送消息">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
                </svg>
              </button>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Toast 容器 -->
  <div id="toast-container" class="toast-container" aria-live="assertive"></div>

  <!-- JavaScript -->
  <script src="js/state.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/sse.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/conversations.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
